name: Release

# Publishes to PyPI when a `v*` tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Preferred: PyPI trusted publishing (OIDC, no secret). Register this repository as a
# trusted publisher of the `pidgely` project on PyPI (workflow `release.yml`,
# environment `pypi`). Fallback: set the repository secret PYPI_API_TOKEN and it is
# used instead.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tag matches the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pidgely/_version.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pidgely.__version__ $version"
            exit 1
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: ruff check . && ruff format --check . && mypy
      - run: pytest
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pidgely/
    permissions:
      contents: write
      id-token: write # PyPI trusted publishing
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (API token)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI (trusted publishing)
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
